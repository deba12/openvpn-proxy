services:
  openvpn:
    build: .
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Required: public IP or hostname of this server (written into generated client configs)
      - SERVER_IP=${SERVER_IP}
      # Required: network behind the VPN client, e.g. 10.20.30.0/24
      # A host route to this network is added on client connect and removed on disconnect.
      - CLIENT_NETWORK=${CLIENT_NETWORK}
      # VPN tunnel subnet — change only if it conflicts with existing host routes
      - VPN_SUBNET=${VPN_SUBNET:-10.8.0.0}
      - VPN_SUBNET_MASK=${VPN_SUBNET_MASK:-255.255.255.0}
    volumes:
      - openvpn-pki:/etc/openvpn/pki
    restart: unless-stopped

volumes:
  openvpn-pki:
